<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Oficina YNG</title>
<style>
:root { --creme:#F3EEE8; --tinta:#111; --coral:#E74F3D; --mudo:#77706a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--creme); color:var(--tinta); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
#porta { min-height:100%; display:grid; place-items:center; padding:24px 16px; }
.caixa { width:min(440px,100%); display:grid; gap:22px; text-align:center; }
.logo { font-weight:900; font-size:clamp(48px,13vw,84px); letter-spacing:.02em; line-height:1; }
.linha { font-size:12px; font-weight:700; letter-spacing:.22em; color:var(--mudo); }
.linha i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--coral); margin-right:8px; vertical-align:1px; }
p { color:var(--mudo); }
form { display:flex; gap:8px; }
input { flex:1; min-width:0; padding:14px 16px; border-radius:12px; border:2px solid rgba(17,17,17,.15); background:#fff; color:var(--tinta); font:inherit; }
input:focus { outline:none; border-color:var(--coral); }
button { padding:0 22px; border-radius:12px; border:0; background:var(--tinta); color:var(--creme); font:inherit; font-weight:700; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
.erro { color:var(--coral); min-height:1.2em; font-size:14px; font-weight:600; }
</style>
</head>
<body>
<div id="porta">
  <div class="caixa">
    <div class="logo">OFICINA</div>
    <div class="linha"><i></i>YNG · PASSO A PASSO</div>
    <p>Documento interno. Introduza a senha que recebeu.</p>
    <form id="f" autocomplete="off">
      <input id="senha" type="password" placeholder="Senha" aria-label="Senha" autofocus>
      <button id="ok" type="submit">Entrar</button>
    </form>
    <div class="erro" id="erro" role="alert"></div>
  </div>
</div>

var $ = function (id) { return document.getElementById(id); };
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function abre(senha) {
  var k = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  k = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(CFG.sal), iterations:CFG.it, hash:'SHA-256' }, k, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var b = b64(CFG.d);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b.slice(0, 12) }, k, b.slice(12)));
}
async function entra(senha, guardar) {
  var html = await abre(senha);
  if (guardar) { try { sessionStorage.setItem('oficina-pp', senha); } catch (x) {} }
  document.open(); document.write(html); document.close();
}
(function () { var s = null; try { s = sessionStorage.getItem('oficina-pp'); } catch (x) {} if (s && window.crypto && crypto.subtle) entra(s, false).catch(function () {}); })();
$('f').addEventListener('submit', async function (e) {

});
